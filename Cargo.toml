[workspace]
resolver = "2"
members = [
    "crates/xmr-joint",
    "crates/konstruado-core",
    "crates/konstruado-net",
    "crates/konstruado-motor",
    "crates/konstruado",
    "crates/konstruado-ffi",
]
# Path deps live in the tree. Without this, cargo los adopta como miembros
# y `cargo test --workspace` corre los tests de oxide y del DKG.
exclude = [
    "crates/xmr-joint/vendor/dkg-pedpop",
    "crates/xmr-joint/vendor/monero-seed",
    "third_party/monero-oxide/monero-oxide",
    "third_party/monero-oxide/monero-oxide/io",
    "third_party/monero-oxide/monero-oxide/ed25519",
    "third_party/monero-oxide/monero-oxide/primitives",
    "third_party/monero-oxide/monero-oxide/epee",
    "third_party/monero-oxide/monero-oxide/interface",
    "third_party/monero-oxide/monero-oxide/interface/daemon",
    "third_party/monero-oxide/monero-oxide/interface/daemon/simple-request",
    "third_party/monero-oxide/monero-oxide/wallet",
    "third_party/monero-oxide/monero-oxide/wallet/address",
    "third_party/monero-oxide/monero-oxide/wallet/base58",
    "third_party/monero-oxide/monero-oxide/ringct/clsag",
    "third_party/monero-oxide/monero-oxide/ringct/mlsag",
    "third_party/monero-oxide/monero-oxide/ringct/borromean",
    "third_party/monero-oxide/monero-oxide/ringct/bulletproofs",
    "third_party/monero-oxide/monero-oxide/ringct/bulletproofs/generators",
]
default-members = ["crates/konstruado"]

[workspace.package]
# Single source for the app version: desktop title/About, konstruado-ffi
# (Android About) and the APK versionName all read this value.
version = "0.2.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/felipebrunet/konstruado"

[profile.release]
# Assets de release: sin símbolos, LTO completo y un solo codegen unit
# (más lento de compilar, binario y .so de Android más chicos y rápidos).
# panic queda en unwind: UniFFI convierte los panics en errores de Kotlin.
strip = true
lto = "fat"
codegen-units = 1

# Igual que el workspace de monero-oxide: en debug estas crates van optimizadas.
# Si no, armar una transacción de stagenet tarda minutos.
[profile.dev.package]
subtle = { opt-level = 3 }
sha3 = { opt-level = 3 }
blake2 = { opt-level = 3 }
argon2 = { opt-level = 3 }
chacha20 = { opt-level = 3 }
curve25519-dalek = { opt-level = 3 }
ff = { opt-level = 3 }
group = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
dalek-ff-group = { opt-level = 3 }
multiexp = { opt-level = 3 }
monero-io = { opt-level = 3 }
monero-primitives = { opt-level = 3 }
monero-ed25519 = { opt-level = 3 }
monero-mlsag = { opt-level = 3 }
monero-clsag = { opt-level = 3 }
monero-borromean = { opt-level = 3 }
monero-bulletproofs-generators = { opt-level = 3 }
monero-bulletproofs = { opt-level = 3 }
monero-oxide = { opt-level = 3 }

[workspace.dependencies]
xmr-joint = { path = "crates/xmr-joint" }
konstruado-core = { path = "crates/konstruado-core" }
konstruado-net = { path = "crates/konstruado-net" }
konstruado-motor = { path = "crates/konstruado-motor" }
konstruado-ffi = { path = "crates/konstruado-ffi" }
