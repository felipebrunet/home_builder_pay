[workspace]
resolver = "2"
members = ["crates/hbp-core", "crates/hbp-bitcoin", "crates/hbp-cli", "crates/hbp-ui"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
hbp-core = { path = "crates/hbp-core" }
hbp-bitcoin = { path = "crates/hbp-bitcoin" }

anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bitcoin = { version = "0.32.8", features = ["std", "rand-std", "serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
rpassword = "7"
hex = "0.4"
miniscript = { version = "12.3.7", features = ["std"] }
musig2 = { version = "0.4.1", features = ["secp256k1", "rand", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
