[package]
name = "hbp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native product GUI for home_builder_pay (Windows-first, egui)"

[lib]
name = "hbp_app"
path = "src/lib.rs"

[[bin]]
name = "home_builder_pay"
path = "src/main.rs"

[dependencies]
hbp-core.workspace = true
hbp-bitcoin.workspace = true
hbp-net = { path = "../hbp-net" }
anyhow.workspace = true
base64.workspace = true
bitcoin.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = "0.29"
egui = "0.29"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
