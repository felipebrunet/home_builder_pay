[package]
name = "konstruado-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI facade for Konstruado Android (core + net Orbot SOCKS + xmr-joint stagenet)"

[lib]
name = "konstruado_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "konstruado-par"
path = "src/bin/konstruado-par.rs"

[dependencies]
uniffi = { version = "0.29.4", features = ["cli"] }
konstruado-core = { path = "../konstruado-core" }
konstruado-net = { path = "../konstruado-net" }
xmr-joint = { path = "../xmr-joint" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
rand_core = { version = "0.6", features = ["getrandom"] }
once_cell = "1"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }
