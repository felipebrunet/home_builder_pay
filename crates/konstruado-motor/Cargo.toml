[package]
name = "konstruado-motor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Motor compartido de Konstruado (caja, respaldo, persistencia, i18n) para escritorio y Android"

[dependencies]
xmr-joint.workspace = true
konstruado-core.workspace = true
konstruado-net.workspace = true
tokio = { version = "1", features = ["time", "rt", "sync", "net", "io-util"] }
# Precio USD/XMR por HTTPS, por el SOCKS de Tor/Orbot cuando hay.
tokio-socks = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "test-util", "macros"] }
