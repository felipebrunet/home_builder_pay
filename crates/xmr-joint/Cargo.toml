[package]
name = "xmr-joint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Monero logic for Konstruado"

[dependencies]
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
zeroize = { version = "1", features = ["std"] }
monero-wallet = { version = "0.2", features = ["multisig"] }
dkg-pedpop = { path = "./vendor/dkg-pedpop" }
frost = { package = "modular-frost", version = "0.11", default-features = false, features = ["ed25519"] }
