# Vendored from https://github.com/kayabaNerve/monero-wallet-util
# commit 797fe701a6f9e99ae614c49479bb981de1afe8ec (branch develop).
# crates.io 0.0.1 is an empty placeholder. std-shims comes from crates.io,
# not the serai git pin, so this tree builds inside the konstruado workspace.

[package]
name = "monero-seed"
version = "0.1.0"
description = "Rust implementation of Monero's seed algorithm"
license = "MIT"
repository = "https://github.com/kayabaNerve/monero-wallet-util/tree/develop/seed"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2021"
rust-version = "1.80"

[lib]
test = false

[dependencies]
std-shims = { version = "0.1.5", default-features = false }
thiserror = { version = "2", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }
rand_core = { version = "0.6", default-features = false }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

[features]
std = [
  "std-shims/std",
  "thiserror",
  "zeroize/std",
  "rand_core/std",
]
default = ["std"]
